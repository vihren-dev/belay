# The test-only conformance library and its runner, which compare the model with native SQLite.
# Only the conformance harness and the judge's subject require this package.
name = "verifierConformance"
version = "0.1.0"
defaultTargets = ["conformance-runner"]

[[require]]
name = "belaySqliteModel"
path = "../belay-sqlite-model"

[[lean_lib]]
name = "VerifierConformance"
roots = ["VerifierConformance.Programs.Scripts.Trace", "VerifierConformance.Tooling.Conformance.Outputs", "VerifierConformance.Tooling.Conformance.PossibleOutputs", "VerifierConformance.Tooling.Conformance.Pass", "VerifierConformance.Schema.Columns.Native", "VerifierConformance.Tooling.Conformance.Native", "VerifierConformance.Tooling.Conformance.Case", "VerifierConformance.Programs.Scripts.RunPass", "VerifierConformance.Tooling.Conformance.RunPass", "VerifierConformance.Tooling.Conformance.RunPassLaws", "VerifierConformance.Programs.Clock.Classify", "VerifierConformance.Tooling.Conformance.Classify", "VerifierConformance.Programs.Claims.RunPassExamples", "VerifierConformance.Schema.Writes.RunPassExamples", "VerifierConformance.Tooling.Conformance.RunPassExamples", "VerifierConformance.Programs.Scripts.RunPassExecutionsExamples", "VerifierConformance.Queries.Preparation.RunPassExecutionsExamples", "VerifierConformance.Tooling.Conformance.RunPassExecutionsExamples", "VerifierConformance.Programs.Scripts.Json", "VerifierConformance.Tooling.Conformance.Json", "VerifierConformance.Queries.Preparation.Predict", "VerifierConformance.Tooling.Conformance.Predict", "VerifierConformance.Schema.ForeignKeys.PredictTables", "VerifierConformance.Tooling.Conformance.PredictTables", "VerifierConformance.Tooling.Conformance.ViewObservation", "VerifierConformance.Queries.Preparation.QueryOutputs", "VerifierConformance.Schema.Dispatch.QueryOutputs", "VerifierConformance.Tooling.Conformance.QueryOutputs"]

[[lean_exe]]
name = "conformance-runner"
root = "ConformanceRunner"
