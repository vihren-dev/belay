# The test-only conformance library and its runner, which compare the model with native SQLite.
# Nothing in the installed runtime requires this package.
name = "verifierConformance"
version = "0.1.0"
defaultTargets = ["conformance-runner"]

[[require]]
name = "belaySqlite"
path = "../belay-sqlite"

[[lean_lib]]
name = "VerifierConformance"
roots = ["VerifierConformance.Trace", "VerifierConformance.Outputs", "VerifierConformance.Native", "VerifierConformance.Case", "VerifierConformance.Json", "VerifierConformance.Predict"]

[[lean_exe]]
name = "conformance-runner"
root = "ConformanceRunner"
