# The verifier library: the contract language, the engineering examples and the kernel gate's libraries.
# The installed runtime ships this package's outputs (build-support/runtime.nix).
name = "sqliteVerifier"
version = "0.1.0"
defaultTargets = ["SqliteVerifier"]

[[require]]
name = "belaySqliteModel"
path = "../belay-sqlite-model"

[[lean_lib]]
name = "SqliteVerifier"
roots = []
globs = ["SqliteVerifier", "SqliteVerifier.Contract", "SqliteVerifier.ContractProofs", "SqliteVerifier.Library", "SqliteVerifier.SchemaProjection", "SqliteVerifier.NullableProjection", "SqliteVerifier.ApplicationKeys", "SqliteVerifier.ApplicationKeyPreservation", "SqliteVerifier.AxiomPolicy", "SqliteVerifier.Audit"]

# Engineering examples are test code with their own build target; the production root excludes them.
[[lean_lib]]
name = "EngineeringExamples"
roots = []
globs = ["SqliteVerifier.Examples", "SqliteVerifier.Demonstration", "SqliteVerifier.ReverseDemonstration", "SqliteVerifier.FailureDemonstration", "SqliteVerifier.SchemaExamples", "SqliteVerifier.SqlExamples", "SqliteVerifier.ApplicationKeyDemonstration"]

[[lean_lib]]
name = "GatePaths"

[[lean_lib]]
name = "GateCore"

# The gate's input decoding, which the proof checker and the bundle checker share.
[[lean_lib]]
name = "GateInputs"
