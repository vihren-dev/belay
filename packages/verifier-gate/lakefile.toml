# The kernel gate's executables: the proof checker, the bundle checker and the proof exporter, and the
# ADR 0008 resolver that writes the generated input modules.
# The installed runtime ships their binaries next to the verifier library's outputs.
name = "verifierGate"
version = "0.1.0"
defaultTargets = ["migration-proof-checker", "migration-bundle-checker", "migration-proof-exporter", "migration-resolver"]

[[require]]
name = "sqliteVerifier"
path = "../sqlite-verifier"

# Populated from the pinned upstream source in build-support/lean4export.nix.
[[require]]
name = "lean4export"
path = "../../build/lean4export"

[[lean_exe]]
name = "migration-proof-checker"
root = "ProofChecker"

[[lean_exe]]
name = "migration-bundle-checker"
root = "BundleChecker"

[[lean_exe]]
name = "migration-proof-exporter"
root = "ProofExporter"

[[lean_exe]]
name = "migration-resolver"
root = "Resolver"
