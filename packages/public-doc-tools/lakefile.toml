# The documentation inventory: it reads the compiled public modules and their sources, so the
# publicDocumentation build can require checked Verso documentation (tools/public_doc_inventory.py).
# The conformance runtime does not contain it.
name = "publicDocTools"
version = "0.1.0"
defaultTargets = ["PublicDocSyntax", "PublicDocInventory", "TheoremDependencies"]

[[lean_lib]]
name = "PublicDocSyntax"

[[lean_lib]]
name = "PublicDocInventory"

[[lean_lib]]
name = "TheoremDependencies"
