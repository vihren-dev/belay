name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # Nightly checks and references run on both platforms. Pull requests run
  # checks and build the reference on Linux only.
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && github.event_name != 'schedule' }}

jobs:
  check:
    name: Check (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            system: x86_64-linux
          - runner: macos-14
            system: aarch64-darwin
    runs-on: ${{ matrix.runner }}
    # The owner limits the complete job to 75 minutes; child limits remain unchanged.
    timeout-minutes: 75
    env:
      BUILD_MODE: build
      # Pull requests run checks and references on Linux. Other events retain
      # both native platforms for every non-documentation scope.
      PLATFORM_RUNS: ${{ matrix.system == 'x86_64-linux' || github.event_name != 'pull_request' }}
    steps:
      - name: Skip macOS checks on pull requests
        if: env.PLATFORM_RUNS != 'true'
        run: echo "macOS checks and the API reference run on main, manual and nightly runs; Linux checks this pull request."
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: env.PLATFORM_RUNS == 'true'
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select complete checks for the changed inputs
        if: env.PLATFORM_RUNS == 'true'
        id: scope
        run: python3 -m tests.ci_scope
      - name: Check that the review log only grows
        if: env.PLATFORM_RUNS == 'true'
        env:
          # Passed as data; tools/review_log_check.py validates it as a full commit hash.
          REVIEW_LOG_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: python3 -m tools.review_log_check
      - name: Check documentation and CI routing
        if: env.PLATFORM_RUNS == 'true' && steps.scope.outputs.scope == 'docs'
        run: |
          python3 tests/docs_test.py
          python3 -m unittest tests.test_ci_scope tests.test_review_log_check
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        if: env.PLATFORM_RUNS == 'true' && steps.scope.outputs.scope != 'docs'
        with:
          enable_kvm: false
          set_as_trusted_user: false
          extra_nix_config: |
            sandbox = true
            sandbox-fallback = false
            keep-outputs = true
            keep-derivations = true
            # The Vihren Attic cache is publicly readable; main runs publish to it
            # (publish-nix-store). A failed substitution falls back to a local build.
            extra-substituters = https://cache.vihren.dev/sqlite-verifier
            extra-trusted-public-keys = sqlite-verifier:XgeRqTIGBEw3VP8GPrzSvdU+5t1lJz7uEMhIG1lh7QE=
            connect-timeout = 5
            fallback = true
      - name: Restore Nix builds and test results
        if: env.PLATFORM_RUNS == 'true' && steps.scope.outputs.scope != 'docs'
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        env:
          # Failed Nix builds can leave unreadable transient locks; never archive them.
          TAR_OPTIONS: --no-wildcards-match-slash --exclude=nix/store/*.lock
        with:
          # The key covers every file except task records, so a push that changes only
          # plans/ or reviews/ restores the exact store of the previous push and saves nothing.
          primary-key: nix-tests-v2-${{ matrix.system }}-${{ hashFiles('nix/*.nix', 'nix/flake.lock') }}-${{ hashFiles('**', '!.git/**', '!plans/**', '!reviews/**') }}
          restore-prefixes-first-match: |
            nix-tests-v2-${{ matrix.system }}-${{ hashFiles('nix/*.nix', 'nix/flake.lock') }}-
            nix-tests-v1-${{ matrix.system }}-${{ hashFiles('nix/*.nix', 'nix/flake.lock') }}-
          # Only accepted main and nightly runs publish caches. Other events restore them.
          save: ${{ github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
      - name: Build checked API reference
        if: env.PLATFORM_RUNS == 'true' && steps.scope.outputs.scope != 'docs'
        env:
          REFERENCE_REVISION: ${{ github.sha }}
        run: nix develop path:./nix --command just reference "$REFERENCE_REVISION"
      - name: Run checks in one pinned environment
        if: env.PLATFORM_RUNS == 'true' && steps.scope.outputs.scope != 'docs'
        env:
          CHECK_SCOPE: ${{ steps.scope.outputs.scope }}
          EXPECTED_SYSTEM: ${{ matrix.system }}
        run: |
          python3 tools/check_resources.py
          nix develop path:./nix --command python3 tools/ci_checks.py \
            --system "$EXPECTED_SYSTEM" --scope "$CHECK_SCOPE" --mode "$BUILD_MODE"
      - name: Retain checked API reference
        if: always() && env.PLATFORM_RUNS == 'true' && steps.scope.outputs.scope != 'docs'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: api-reference-${{ matrix.system }}
          path: build/api-reference/
          if-no-files-found: error
          retention-days: 14
      - name: Keep only the store paths that this commit needs
        if: always() && env.PLATFORM_RUNS == 'true' && steps.scope.outputs.scope != 'docs'
        # A failure only leaves the saved cache larger; it never changes a check result.
        continue-on-error: true
        run: nix develop path:./nix --command python3 tools/ci_store_gc.py
      - name: Retain pytest reports and Nix test outputs
        if: always() && env.PLATFORM_RUNS == 'true' && steps.scope.outputs.scope != 'docs'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: case-reports-${{ matrix.system }}
          path: |
            build/test-results/
            build/nix-tests*/
            build/ci-phases.json
            build/ci-phases/
            build/ci-environment.json
          if-no-files-found: warn
          retention-days: 14

  mutants:
    name: Mutants (${{ matrix.suite }}, ${{ matrix.system }})
    # The mutant suites of the model (tests/nix_mutant_suites.json) run here, one runner each, in
    # parallel with the check job and for the full scope only: together they need more time
    # than the check job has left (pull request #191). They never save a cache.
    strategy:
      fail-fast: false
      matrix:
        suite: [mutants, queryMutants, valueMutants, jsonDateMutants, queryFeatureMutants, querySourceMutants, insertQueryMutants, renameMutants, columnDropMutants, tableMutants, functionMutants]
        system: [x86_64-linux, aarch64-darwin]
        include:
          - system: x86_64-linux
            runner: ubuntu-22.04
          - system: aarch64-darwin
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    env:
      PLATFORM_RUNS: ${{ matrix.system == 'x86_64-linux' || github.event_name != 'pull_request' }}
    steps:
      - name: Skip macOS checks on pull requests
        if: env.PLATFORM_RUNS != 'true'
        run: echo "macOS mutant suites run on main, manual and nightly runs; Linux checks this pull request."
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: env.PLATFORM_RUNS == 'true'
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select complete checks for the changed inputs
        if: env.PLATFORM_RUNS == 'true'
        id: scope
        run: python3 -m tests.ci_scope
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        if: env.PLATFORM_RUNS == 'true' && steps.scope.outputs.scope == 'full'
        with:
          enable_kvm: false
          set_as_trusted_user: false
          extra_nix_config: |
            sandbox = true
            sandbox-fallback = false
            keep-outputs = true
            keep-derivations = true
            extra-substituters = https://cache.vihren.dev/sqlite-verifier
            extra-trusted-public-keys = sqlite-verifier:XgeRqTIGBEw3VP8GPrzSvdU+5t1lJz7uEMhIG1lh7QE=
            connect-timeout = 5
            fallback = true
      - name: Restore Nix builds
        if: env.PLATFORM_RUNS == 'true' && steps.scope.outputs.scope == 'full'
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        env:
          TAR_OPTIONS: --no-wildcards-match-slash --exclude=nix/store/*.lock
        with:
          primary-key: nix-tests-v2-${{ matrix.system }}-${{ hashFiles('nix/*.nix', 'nix/flake.lock') }}-${{ hashFiles('**', '!.git/**', '!plans/**', '!reviews/**') }}
          restore-prefixes-first-match: |
            nix-tests-v2-${{ matrix.system }}-${{ hashFiles('nix/*.nix', 'nix/flake.lock') }}-
            nix-tests-v1-${{ matrix.system }}-${{ hashFiles('nix/*.nix', 'nix/flake.lock') }}-
          save: false
      - name: Run the mutant suite
        if: env.PLATFORM_RUNS == 'true' && steps.scope.outputs.scope == 'full'
        env:
          MUTANT_SUITE: ${{ matrix.suite }}
        run: nix develop path:./nix --command just test-mutants "$MUTANT_SUITE"
      - name: Retain the mutant suite report
        if: always() && env.PLATFORM_RUNS == 'true' && steps.scope.outputs.scope == 'full'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mutant-reports-${{ matrix.suite }}-${{ matrix.system }}
          path: build/nix-tests-mutants/
          if-no-files-found: warn
          retention-days: 14

  publish-nix-store:
    name: Publish Nix store (${{ matrix.system }})
    # After both native checks of a main push or nightly run pass, upload the store
    # that the check job saved to the Vihren Attic cache. Only this job can use the
    # attic-publish environment, which deploys only from main and holds the write
    # token. An upload failure never fails the workflow or changes a check result.
    if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            system: x86_64-linux
          - runner: macos-14
            system: aarch64-darwin
    runs-on: ${{ matrix.runner }}
    environment: attic-publish
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          enable_kvm: false
          set_as_trusted_user: false
          extra_nix_config: |
            keep-outputs = true
            keep-derivations = true
      - name: Restore the store that the check job saved
        id: restore
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          # The check job's primary key for this commit; this job never saves.
          primary-key: nix-tests-v2-${{ matrix.system }}-${{ hashFiles('nix/*.nix', 'nix/flake.lock') }}-${{ hashFiles('**', '!.git/**', '!plans/**', '!reviews/**') }}
          save: false
      - name: Upload store paths that cache.nixos.org does not provide
        if: steps.restore.outputs.hit-primary-key == 'true'
        env:
          ATTIC_WRITE_TOKEN: ${{ secrets.ATTIC_WRITE_TOKEN }}
        run: |
          attic="$(nix build --no-link --print-out-paths --inputs-from path:./nix nixpkgs#attic-client)/bin/attic"
          "$attic" login vihren https://cache.vihren.dev "$ATTIC_WRITE_TOKEN"
          nix path-info --all | grep -v '\.drv$' | "$attic" push vihren:sqlite-verifier --stdin
