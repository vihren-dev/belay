name: Upload test observations

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    - cron: "47 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  upload:
    runs-on: ubuntu-22.04
    environment: belay-observability
    timeout-minutes: 20
    # No test result depends on database availability. Retained artifacts retry daily.
    continue-on-error: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - name: Connect uploader to Tailscale
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4
        timeout-minutes: 5
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:belay-ci
          ping: vihren-demo.tail114da.ts.net
      - name: Upload observations with trusted code
        env:
          GH_TOKEN: ${{ github.token }}
          BELAY_OBSERVABILITY_RUN_ID: ${{ github.event.workflow_run.id || '' }}
          BELAY_CLICKHOUSE_URL: ${{ vars.BELAY_CLICKHOUSE_INTERNAL_URL }}
          BELAY_CLICKHOUSE_CA_PEM: ${{ vars.BELAY_CLICKHOUSE_CA_PEM }}
          BELAY_CLICKHOUSE_CA: ${{ runner.temp }}/belay-clickhouse-ca.pem
          BELAY_CLICKHOUSE_USER: ${{ vars.BELAY_CLICKHOUSE_USER }}
          BELAY_CLICKHOUSE_PASSWORD: ${{ secrets.CLICKHOUSE_PASSWORD }}
        run: |
          : "${BELAY_CLICKHOUSE_URL:?Set BELAY_CLICKHOUSE_INTERNAL_URL in the GitHub environment}"
          : "${BELAY_CLICKHOUSE_CA_PEM:?Set BELAY_CLICKHOUSE_CA_PEM in the GitHub environment}"
          trap 'rm -f -- "$BELAY_CLICKHOUSE_CA"' EXIT
          printf '%s\n' "$BELAY_CLICKHOUSE_CA_PEM" > "$BELAY_CLICKHOUSE_CA"
          python3 -m tools.observability_ci
