# Tests of the Lean code store prototype. Run them with
#   python3 -m pytest -c experiments/lean-code-store/pytest.ini experiments/lean-code-store/tests
# This file makes the experiment its own root, so the repository's test plugins (fixtures and
# the upload of test observations) are not loaded for an experiment.
[pytest]
testpaths = tests
addopts = --strict-markers --strict-config -ra -p no:cacheprovider
markers =
    unit: deterministic unit behavior with explicit isolated inputs
    requires_lean: requires the pinned Lean compiler and Lake
    requires_clickhouse: requires clickhouse-local
    timeout(seconds): the time limit of one test, which tests/conftest.py enforces
